---
model: SASRecAlign

# Model parameters - unified to 256
hidden_size: 256

# Dataset
dataset: yelp2018
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 200
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'uni100','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# LLM text embeddings without cross / align
item_text_emb_path_llm: dataset/yelp2018/item_text_emb.qwen3.npy
use_llm: true
use_cross: false
use_align: false
alignment_weight: 0.0
temperature: 0.07
detach_text_emb: true
normalize_text: true


