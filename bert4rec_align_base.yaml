---
model: BERT4RecAlign

# Dataset
dataset: Amazon_Beauty
data_path: dataset
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
NEG_PREFIX: neg_
LABEL_FIELD: label
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 200
train_batch_size: 512
eval_batch_size: 512
learner: adam
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'uni100','test':'uni100'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null
transform: mask_itemseq

# Align-only baseline (Base TF-IDF+SVD embeddings)
item_text_emb_path: dataset/Amazon_Beauty/item_text_emb.base.npy
alignment_weight: 0.1
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_fusion: false


