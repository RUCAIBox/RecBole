---
# Single-file config: Run SASRecAlign in pure SASRec mode (no text features)
#
# Usage:
#   python run_recbole.py --model SASRec_Align --dataset Amazon_Beauty \
#     --config_files sasrec_align_text_off.yaml
#
# Notes:
# - disable_text_feature: True ensures no text embeddings are loaded; all text/cross/align paths are disabled.
# - Other knobs below are set to neutral to match SASRec baseline behavior.

model: SASRecAlign

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 200
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'uni100','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Model parameters (keep consistent with baseline)
hidden_size: 256

# Disable text & related branches to mimic pure SASRec
disable_text_feature: True
use_llm: False
use_cross: False
cross_dropout_prob: 0.0
use_align: False
alignment_weight: 0.0
temperature: 0.07

# Keep other optional knobs neutral
text_weight: 1.0
text_tail_threshold: 0
text_mlp_bn: False
text_proj_norm: False
fused_item_norm: False
normalize_text: True
detach_text_emb: True

# Scoring / training augmentations neutral
cosine_score: False
cosine_scale: 10.0
token_dropout_prob: 0.0
text_gate_init: 0.5
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0


